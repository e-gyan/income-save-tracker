<!doctype html>
<html lang="en">
  <head>
    <style>
      vite-error-overlay {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        // Intercept Vite HMR / ping WebSockets when HMR is disabled so @vite/client never throws "WebSocket closed without opened."
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          var PatchedWebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            var urlStr = String(url || '');
            if (
              protoStr.indexOf('vite-hmr') !== -1 ||
              protoStr.indexOf('vite-ping') !== -1 ||
              urlStr.indexOf('__vite_ping') !== -1
            ) {
              var listeners = {};
              var fakeWs = {
                url: urlStr,
                protocol: protoStr,
                readyState: 1,
                 bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {
                  this.readyState = 3;
                },
                addEventListener: function(type, cb) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(cb);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        cb(new Event('open'));
                      } catch (_e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, cb) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(fn) {
                    return fn !== cb;
                  });
                },
                dispatchEvent: function() {
                  return true;
                },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                if (typeof fakeWs.onopen === 'function') {
                  try {
                    fakeWs.onopen(new Event('open'));
                  } catch (_e) {}
                }
              }, 0);
              return fakeWs;
            }
            return protocols !== undefined
              ? new OrigWebSocket(url, protocols)
              : new OrigWebSocket(url);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        // Suppress harmless Vite dev server HMR WebSocket closure notifications in AI Studio iframe environment
        function isWsError(msg) {
          if (!msg) return false;
          var str = String(msg);
          return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('closed without opened') !== -1;
        }

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message);
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason && (event.reason.message || String(event.reason));
          if (isWsError(reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Filter out Vite HMR connection closed noise in console
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var hasWs = args.some(function(arg) {
            return isWsError(arg && (arg.message || String(arg)));
          });
          if (hasWs) return;
          origConsoleError.apply(console, args);
        };
      })();
    </script>
